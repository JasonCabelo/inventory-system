services:
  - type: web
    name: inventory-api
    runtime: node
    plan: free
    buildCommand: npm install && cd server && npm install && cd ..
    startCommand: node server/index.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: PORT
        value: 10000
