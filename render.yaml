services:
  - type: web
    name: inventory-api
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: npm start --workspace=server
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 30d

  - type: static site
    name: inventory-web
    staticPublishPath: ./src/dist
    buildCommand: npm run build --workspace=src
    rootDir: ./src
